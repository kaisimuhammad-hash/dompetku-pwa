name = "dompetku-keepalive"
main = "src/index.js"
compatibility_date = "2026-11-16"

# Ganti dengan alamat Render kamu (tanpa garis miring di akhir).
[vars]
APP_URL = "https://dompetku.onrender.com"

# Setiap 10 menit, lebih cepat dari batas tidur Render (15 menit).
[triggers]
crons = ["*/10 * * * *"]
